<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111018"><title>光影藏册 · 二次元闪卡相簿</title><meta name="description" content="一册藏画，万种光影。搜索、收藏与沉浸欣赏分层全息闪卡。"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="stylesheet" href="album.css?v=20261011-scroll"><link rel="stylesheet" href="album-next.css?v=20261011-scroll"><script type="module" src="album-next.js?v=20261011-scroll"></script><link rel="stylesheet" href="glass.css?v=20261011-scroll"></head><body><div id="scroll-progress" aria-hidden="true"></div>
<header class="site-header"><a class="brand" href="./"><img src="assets/favicon.svg" width="26" height="26" alt=""> 光影藏册 <span>HOLO ARCHIVE</span></a><span class="header-note">一座随身的光影美术馆</span></header>
<main><section id="intro" class="intro compact"><div><p class="eyebrow">A QUIET GALLERY, ALWAYS IN MOTION</p><h1>把光影，<span>慢慢展开。</span></h1><p class="intro-copy">每一幅画，都有属于自己的光。滑动浏览，轻触走近。</p><button id="browse" class="browse-button">展开画卷</button></div><div class="stamp"><small>COLLECTED MOMENTS</small><strong id="total-count">—</strong><p>幅画面 · 等你走近</p></div></section>
<section aria-labelledby="collection-title"><div class="section-bar"><h2 id="collection-title">画卷藏品 <small id="result-count"></small></h2><label class="reduce"><input id="reduce" type="checkbox"> 减少动态效果</label></div><div class="toolbar"><label class="search-label"><span class="sr-only">搜索标题或原文件名</span><span id="search-icon" aria-hidden="true"></span><input id="search" type="search" placeholder="寻找一幅画…" autocomplete="off"></label><label><span class="sr-only">画面比例</span><select id="orientation"><option value="all">全部比例</option><option value="portrait">竖幅</option><option value="landscape">横幅</option><option value="square">方形</option></select></label><label><span class="sr-only">排序</span><select id="sort"><option value="default">默认顺序</option><option value="name">名称排序</option><option value="new">新加入优先</option></select></label><label class="fav-filter"><input id="favorites-only" type="checkbox"><span id="filter-heart" aria-hidden="true"></span> 我的收藏</label></div>
<p id="catalog-error" class="empty" hidden>相簿加载失败，请检查网络。<button id="catalog-retry">重试</button></p><p id="empty" class="empty" hidden>没有找到这幅画。换一个词，或重新展开全部藏品。<button id="clear-filters">清除筛选</button></p><div id="gallery" class="gallery" aria-label="闪卡藏品"></div></section>
<footer><span>光影藏册 · 在光里，慢慢看</span><p>保留插画原有署名 · 收藏仅保存在本机浏览器</p><a href="cards/lantern.html">灯下之约 · 原链接</a></footer></main>
<dialog id="viewer" aria-labelledby="viewer-title"><div class="viewer-shell"><header class="viewer-header"><div><p id="viewer-count" class="eyebrow"></p><h2 id="viewer-title"></h2></div><div class="header-actions"><button id="favorite" aria-pressed="false">收藏</button><button id="immersive" aria-pressed="false">沉浸观赏</button><button id="close" class="icon-button" aria-label="关闭闪卡">✕</button></div></header><div class="viewer-stage"><button id="previous" class="nav-button" aria-label="上一张" title="上一张（←）"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 6.5 9 12l5.5 5.5"/></svg></button><div id="card-host"></div><button id="next" class="nav-button" aria-label="下一张" title="下一张（→）"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9.5 6.5 5.5 5.5-5.5 5.5"/></svg></button><p id="loading" class="stage-status" role="status">正在载入光影…</p><div id="load-error" class="stage-status" hidden><p>暂时无法载入闪卡</p><button id="retry">重试加载</button></div></div>
<div class="viewer-controls"><div class="control-buttons"><button id="flip">翻面</button><button id="motion" aria-pressed="false">开启手机感应</button><button id="recenter">回正</button></div><div class="slider-row"><label for="depth">景深 <input id="depth" type="range" min="-3" max="3" step="0.05" value="0"><output id="depth-value" for="depth">0.00×</output></label><label for="contour">轮廓光 <input id="contour" type="range" min="0" max="3" step="0.05" value="0.15"><output id="contour-value" for="contour">0.15×</output></label></div><p id="hint" role="status">拖动旋转 · 轻点翻面 · ← → 切换 · Esc 关闭</p></div></div></dialog>
<button id="tour" aria-pressed="false">漫游画卷</button><button id="back-top" aria-label="回到开卷" title="回到开卷"></button><p id="toast" role="status" hidden></p></body></html>
